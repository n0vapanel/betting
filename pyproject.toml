[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-betting-bot-simple"
version = "0.1.0"
description = "Telegram sports-betting tips bot: fixtures, odds, news -> tiered predictions"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot==22.8",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "aiohttp>=3.9",
    "pandas>=1.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["telegram_betting_bot_simple*"]
